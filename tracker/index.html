<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f131b" />
    <title>FinTracker — Personal Finance</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- PIN Lock Screen -->
    <div id="lock" class="lock hidden">
      <div class="lock-box">
        <div class="lock-icon">🔒</div>
        <h2>Enter PIN</h2>
        <div class="pin-dots" id="pinDots"></div>
        <div class="pin-pad" id="pinPad"></div>
        <p class="err" id="pinErr"></p>
      </div>
    </div>

    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">💸</div>
        <h1>FinTracker</h1>
        <span class="view-chip" id="headerTitle">Dashboard</span>
      </div>
      <button class="icon-btn" data-act="go-search" title="Global Search">
        <span class="ms">search</span>
      </button>
    </header>

    <main id="view"></main>

    <button class="fab" id="fab" data-act="add-expense" title="Add Expense">
      <span class="ms fill">add</span>
    </button>

    <nav class="bottom-nav" id="bottomNav">
      <button data-nav="dashboard" class="active">
        <span class="ms fill">home</span>Home
      </button>
      <button data-nav="expenses">
        <span class="ms">payments</span>Expenses
      </button>
      <button data-nav="savings"><span class="ms">savings</span>Savings</button>
      <button data-nav="reports">
        <span class="ms">leaderboard</span>Reports
      </button>
      <button data-nav="more"><span class="ms">more_horiz</span>More</button>
    </nav>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script src="js/db.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
